# Publication PRÉPARÉE (image + texte) sur la page Facebook Clicvia, lancée à la main (18/10/2026). Une seule fois par publication.
name: facebook-publication
on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom de la publication (assets/publications/<nom>.jpg + donnees/publications/<nom>.txt)"
        required: true
      essai:
        description: "1 = ne rien publier, afficher seulement"
        default: "0"
permissions:
  contents: write
concurrency:
  group: facebook
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/facebook-publication.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          NOM: ${{ github.event.inputs.nom }}
          ESSAI: ${{ github.event.inputs.essai || '0' }}
      - name: Garder la mémoire des publications
        if: always()
        run: |
          git config user.name "robot-facebook"
          git config user.email "robot-facebook@users.noreply.github.com"
          git add donnees/facebook-publications.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "Facebook : publication du $(date +%d/%m/%Y)"
          for essai in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((essai * 5)); done
          exit 1
