# Robot « publication du jour de Mon agent immobilier » (09/11/2026, demande d'Ahmed) : UNE image par jour à 13h20 (entre les deux Reels de
# l'Immobilier de 8h20 et 18h20), publiée sur Facebook, et sur Instagram dès que Mon agent a SON compte (secret MONAGENT_IG_USER_ID : jamais
# le compte @immobilier.clicvia, personne ne doit faire le lien entre les deux sites). Code : tools/monagent_post.mjs ; test : tools/test_monagent_post.mjs.
# Secrets : FB_PAGE_ID / FB_PAGE_TOKEN (page Clicvia, par défaut) ou MONAGENT_FB_PAGE_ID / MONAGENT_FB_PAGE_TOKEN (page propre à Mon agent),
# MONAGENT_IG_USER_ID (compte Instagram propre à Mon agent, relié à cette page). L'image est enregistrée dans monagent/ et servie par clicvia.com.
name: monagent-post
on:
  schedule:
    - cron: "17 12 * * *"    # 13h17 à Tunis (GitHub a lancé avec 7 h de retard les 10 et 11/11 : minute inhabituelle + 2e chance)
    - cron: "41 14 * * *"    # 15h41 à Tunis : 2e chance si le passage du midi n'a pas publié (déjà publié = rien à faire)
  workflow_dispatch:
    inputs:
      essai:
        description: "1 = fabriquer l'image et la légende sans publier (dans Artifacts)"
        default: "1"
      verifier:
        description: "1 = seulement vérifier le jeton (durable, autorisations, page et Instagram reliés), sans rien publier"
        default: "0"
      jour:
        description: "Date simulée AAAA-MM-JJ (vide = aujourd'hui)"
        default: ""
permissions:
  contents: write     # image du jour (monagent/<date>.jpg) + mémoire des publications (donnees/monagent-posts.json)
concurrency:
  group: monagent-post
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Outils (ffmpeg, polices arabes de secours)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - name: Vérifier le jeton seulement (verifier = 1)
        if: github.event.inputs.verifier == '1'
        run: node tools/monagent_post.mjs
        env:
          VERIFIER: "1"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MONAGENT_FB_PAGE_ID: ${{ secrets.MONAGENT_FB_PAGE_ID }}
          MONAGENT_FB_PAGE_TOKEN: ${{ secrets.MONAGENT_FB_PAGE_TOKEN }}
          MONAGENT_IG_USER_ID: ${{ secrets.MONAGENT_IG_USER_ID }}
      - name: Test du robot (données du site en ligne)
        if: github.event.inputs.verifier != '1'
        run: node tools/test_monagent_post.mjs
      - name: Fabriquer l'image et la légende du jour
        if: github.event.inputs.verifier != '1'
        run: node tools/monagent_post.mjs
        env:
          PHASE: fabriquer
          ESSAI: ${{ github.event.inputs.essai || '0' }}
          JOUR: ${{ github.event.inputs.jour }}
      - name: Garder l'image du jour (Artifacts, 7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-monagent
          path: |
            monagent/*.jpg
            monagent/*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Enregistrer l'image dans le dépôt (servie par clicvia.com, lue là par Facebook et Instagram)
        if: github.event.inputs.essai != '1' && github.event.inputs.verifier != '1'
        run: |
          git config user.name "robot-monagent"
          git config user.email "robot-monagent@users.noreply.github.com"
          rm -f monagent/*.png monagent/*.html
          git add monagent/*.jpg monagent/*.txt donnees/monagent-posts.json
          git diff --cached --quiet && exit 0
          git commit -qm "Mon agent : publication du $(date +%d/%m/%Y)"
          for essai in 1 2 3 4; do git pull --rebase -X theirs --autostash -q && git push -q && exit 0; sleep $((essai * 5)); done
          echo "ÉCHEC : image non enregistrée (rien ne peut être publié)"; exit 1
      - name: Publier (Facebook ; Instagram si Mon agent a son compte)
        if: github.event.inputs.essai != '1' && github.event.inputs.verifier != '1'
        run: node tools/monagent_post.mjs
        env:
          PHASE: publier
          JOUR: ${{ github.event.inputs.jour }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MONAGENT_FB_PAGE_ID: ${{ secrets.MONAGENT_FB_PAGE_ID }}
          MONAGENT_FB_PAGE_TOKEN: ${{ secrets.MONAGENT_FB_PAGE_TOKEN }}
          MONAGENT_IG_USER_ID: ${{ secrets.MONAGENT_IG_USER_ID }}
      - name: Noter les liens de la publication
        if: always() && github.event.inputs.essai != '1' && github.event.inputs.verifier != '1'
        run: |
          git add donnees/monagent-posts.json
          git diff --cached --quiet && exit 0
          git commit -qm "Mon agent : liens de la publication du $(date +%d/%m/%Y)"
          for essai in 1 2 3 4; do git pull --rebase -X theirs --autostash -q && git push -q && exit 0; sleep $((essai * 5)); done
          echo "ÉCHEC : mémoire non enregistrée (risque de republier demain la même image)"; exit 1
