# STATISTIQUES DES RÉSEAUX, LECTURE SEULE (27/11/2026, enquête IMM.V) : ne publie rien ; journal = totaux seulement (tools/stats_reseaux.py).
name: stats-reseaux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lire les statistiques (rien n est publie)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MONAGENT_FB_PAGE_ID: ${{ secrets.MONAGENT_FB_PAGE_ID }}
          MONAGENT_FB_PAGE_TOKEN: ${{ secrets.MONAGENT_FB_PAGE_TOKEN }}
          MONAGENT_IG_USER_ID: ${{ secrets.MONAGENT_IG_USER_ID }}
        run: python3 tools/stats_reseaux.py
