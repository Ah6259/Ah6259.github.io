*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texte);font:16px/1.55 Figtree,system-ui,sans-serif}
.hero{background:linear-gradient(160deg,#1E4A73,#11243A);color:#fff;padding:36px 16px 70px}

a.site{display:flex;gap:14px;align-items:center;background:var(--carte);border:1px solid var(--ligne);border-radius:18px;padding:16px;
  text-decoration:none;color:var(--texte);box-shadow:var(--ombre);transition:transform .15s}
a.site:hover{transform:translateY(-2px)}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.site h2{margin:0 0 3px;font-size:18px}

.partager svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.video-main{max-width:780px;margin:0 auto;padding:0 16px}
.video-page{max-width:560px;margin:0 auto;padding:26px 0 20px;text-align:center}

.video-lecteur{display:block;height:min(58vh,640px);width:auto;max-width:100%;aspect-ratio:9/16;object-fit:contain;margin:0 auto 18px;border-radius:18px;background:#111;box-shadow:var(--ombre)}

.lien-video{text-align:center;font-size:14px;margin:22px 0 0}.lien-video a{color:var(--doux)}
footer{max-width:780px;margin:28px auto 0;padding:0 16px 32px;color:var(--doux);font-size:13.5px}
